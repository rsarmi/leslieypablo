name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  # Permite relanzar el deploy a mano desde la pestaña Actions.
  workflow_dispatch:

# Un solo deploy a la vez. Si se empujan dos commits seguidos, gana el último;
# no cancelamos el que ya está corriendo para no dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
